name: Build Playdita APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Single Module and Keystore
        run: |
          # 1. Setup debug keystore
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 2. Consolidate lemuroid-app into app cleanly
          if [ -d "lemuroid-app" ]; then
            echo "Merging lemuroid-app into app..."
            mkdir -p app
            # Copy all base files from lemuroid-app to app without overwriting existing files in app
            cp -rn lemuroid-app/* app/ 2>/dev/null || true
            # Remove lemuroid-app to prevent duplicate resource and module conflicts
            rm -rf lemuroid-app
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playdita-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Publish Release
    needs: [ build ]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Single Module and Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ -d "lemuroid-app" ]; then
            echo "Merging lemuroid-app into app..."
            mkdir -p app
            cp -rn lemuroid-app/* app/ 2>/dev/null || true
            rm -rf lemuroid-app
          fi

      - name: Build APK for Release
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build (Auto)' }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
